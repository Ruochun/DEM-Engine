[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11>=2.11.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "deme3"
version = "3.0.0"
description = "Python bindings for DEM-Engine - a GPU-accelerated Discrete Element Method simulation engine"
readme = "README.md"
authors = [
    { name = "Ruochun Zhang", email = "ruochunz@gmail.com" },
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pybind11>=2.11.0",
]

[project.urls]
Homepage = "https://github.com/projectchrono/DEM-Engine"
Repository = "https://github.com/projectchrono/DEM-Engine"
Documentation = "https://github.com/projectchrono/DEM-Engine"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.verbose = true
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
DEME_BUILD_PYTHON = "ON"
# Demos and modular tests are useful in developer builds but are not wheel content.
DEME_BUILD_DEMOS = "OFF"

[tool.cibuildwheel]
# DEME contains a CPython extension, so every supported interpreter needs its own wheel.
build = "cp3{9,10,11,12,13,14}-manylinux_x86_64"
skip = "*-musllinux_*"
build-verbosity = 1

[tool.cibuildwheel.linux]
# Build on glibc 2.28 with CUDA 12.9. DEME runtime-compiles CUDA kernels and therefore requires the matching host CUDA
# toolkit as well as its driver; never bundle a driver stub or a partial NVRTC installation into the wheel.
manylinux-x86_64-image = "quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9:latest"
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 --exclude libcuda.so.1 --exclude libcudart.so.12 --exclude libnvrtc.so.12 -w {dest_dir} {wheel}"
